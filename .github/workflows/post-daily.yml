name: Daily Instagram post

# GitHub often starts scheduled runs hours late. So the first run starts around
# 1 AM and waits until 6:00 AM Pacific to post. The later times are backups:
# if a post already went out, they see posted.txt and do nothing.
on:
  schedule:
    - cron: "47 8 * * *"    # ~1:47 AM PDT / 12:47 AM PST  (waits until 6:00)
    - cron: "17 11 * * *"   # ~4:17 AM PDT / 3:17 AM PST   (waits until 6:00)
    - cron: "17 13 * * *"   # backup
    - cron: "47 14 * * *"   # backup
    - cron: "17 17 * * *"   # backup
  workflow_dispatch:
    inputs:
      force:
        description: "Post today's folder right now (skip the 6 AM check)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE: ${{ inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

      - name: Wait until 6 AM Pacific
        run: |
          python post.py wait
          git pull --ff-only

      - name: Convert PNG cards to JPG
        id: prepare
        run: |
          pip install --quiet pillow
          python post.py prepare

      - name: Save converted images
        if: steps.prepare.outputs.converted == 'true'
        run: |
          git add -A posts
          git commit -m "Convert $(TZ=America/Los_Angeles date +%F) cards to JPG"
          git push

      - name: Publish today's post
        id: post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post.py publish

      - name: Mark today as posted
        if: steps.post.outputs.posted == 'true'
        run: |
          git add posts
          git commit -m "Mark $(TZ=America/Los_Angeles date +%F) as posted"
          git push
